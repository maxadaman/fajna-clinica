[project]
name = "fajna-clinica"
version = "0.1.0"
description = "Home Assistant integration for the Fajna Clinic patient account"
requires-python = ">=3.14.2,<3.15"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.375",
    "beautifulsoup4>=4.12",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# Copy and comments here are Ukrainian: Cyrillic letters are not lookalikes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant"]
